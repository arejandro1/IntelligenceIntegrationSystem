<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>IIS 情报中心 - 登录</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --login-primary: #1f5fbf;
            --login-primary-dark: #174a96;
            --login-text: #1f2937;
            --login-muted: #64748b;
            --login-border: #dbe3ef;
            --login-background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--login-text);
            background:
                radial-gradient(circle at top right, rgba(31, 95, 191, 0.14), transparent 34%),
                var(--login-background);
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
        }

        .login-shell {
            width: min(100%, 430px);
        }

        .brand {
            margin-bottom: 18px;
            color: var(--login-primary);
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
        }

        .login-card {
            padding: clamp(24px, 5vw, 36px);
            background: #fff;
            border: 1px solid var(--login-border);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(31, 55, 88, 0.12);
        }

        .login-header {
            margin: 0 0 8px;
            color: var(--login-text);
            font-size: clamp(1.5rem, 4vw, 1.8rem);
            font-weight: 700;
            text-align: center;
        }

        .login-description {
            margin: 0 0 24px;
            color: var(--login-muted);
            font-size: 0.92rem;
            line-height: 1.6;
            text-align: center;
        }

        .flash-message {
            margin-bottom: 16px;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .flash-error {
            color: #9b1c1c;
            background: #fff1f2;
            border: 1px solid #fecdd3;
        }

        .flash-success {
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .field-control {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            color: var(--login-text);
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }

        .field-control:focus {
            outline: 3px solid rgba(31, 95, 191, 0.18);
            border-color: var(--login-primary);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .field-control {
            padding-right: 46px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 34px;
            height: 34px;
            color: #64748b;
            background: transparent;
            border: 0;
            border-radius: 6px;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: var(--login-primary);
            background: #eff6ff;
        }

        .password-toggle:focus-visible,
        .login-button:focus-visible,
        .back-link:focus-visible {
            outline: 3px solid rgba(31, 95, 191, 0.25);
            outline-offset: 2px;
        }

        .login-button {
            width: 100%;
            min-height: 46px;
            margin-top: 4px;
            color: #fff;
            background: var(--login-primary);
            border: 1px solid var(--login-primary);
            border-radius: 8px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .login-button:hover {
            background: var(--login-primary-dark);
            border-color: var(--login-primary-dark);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .login-footer {
            margin-top: 20px;
            color: var(--login-muted);
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            color: var(--login-primary);
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="login-shell" aria-labelledby="login-title">
        <div class="brand"><i class="bi bi-broadcast-pin" aria-hidden="true"></i> IIS 情报中心</div>
        <section class="login-card">
            <h1 class="login-header" id="login-title">系统登录</h1>
            <p class="login-description">登录后访问情报检索、分析和系统管理功能。</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div id="flashArea" aria-live="assertive">
                {% for category, message in messages %}
                <div class="flash-message flash-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" id="loginForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="field-group">
                    <label for="username" class="field-label">用户名</label>
                    <input type="text" class="field-control" id="username" name="username"
                        placeholder="请输入用户名" value="{{ username or '' }}" autocomplete="username" required>
                </div>

                <div class="field-group">
                    <label for="password" class="field-label">密码</label>
                    <div class="password-wrap">
                        <input type="password" class="field-control" id="password" name="password"
                            placeholder="请输入密码" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" id="passwordToggle"
                            aria-label="显示密码" title="显示密码">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                    <span id="loginBtnText">登录</span>
                </button>
            </form>

            <div class="login-footer">
                <i class="bi bi-shield-check" aria-hidden="true"></i>
                登录连接使用会话保护，请勿在公共设备上保存密码。
            </div>
        </section>

        <a class="back-link" href="{{ url_for('index') }}">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> 返回公开首页
        </a>
    </main>

    <script>
        (function () {
            const form = document.getElementById('loginForm');
            const button = document.getElementById('loginBtn');
            const buttonText = document.getElementById('loginBtnText');
            const password = document.getElementById('password');
            const toggle = document.getElementById('passwordToggle');

            toggle.addEventListener('click', function () {
                const visible = password.type === 'text';
                password.type = visible ? 'password' : 'text';
                toggle.setAttribute('aria-label', visible ? '显示密码' : '隐藏密码');
                toggle.setAttribute('title', visible ? '显示密码' : '隐藏密码');
                toggle.querySelector('i').className = visible ? 'bi bi-eye' : 'bi bi-eye-slash';
            });

            form.addEventListener('submit', function () {
                button.disabled = true;
                buttonText.textContent = '提交中…';

                // 网络请求异常且页面未跳转时，允许用户恢复提交。
                window.setTimeout(function () {
                    if (document.visibilityState === 'visible' && button.disabled) {
                        button.disabled = false;
                        buttonText.textContent = '重新登录';
                    }
                }, 15000);
            });
        }());
    </script>
</body>

</html>
