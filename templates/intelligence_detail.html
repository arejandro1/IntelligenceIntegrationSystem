{% extends "base.html" %}

{% block title %}情报详情 - IIS 情报中心{% endblock %}

{% block head %}
<style>
    /* 针对独立页面的额外布局样式 */
    body {
        background-color: #f8f9fa;
    }

    .standalone-container {
        max-width: 1000px;
        margin: 10px auto;
        background: white;
        padding: 25px 35px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    footer {
        margin-top: 40px;
        border-top: 1px solid #eee;
        padding: 20px 0;
        font-size: 0.9rem;
        color: #6c757d;
    }
</style>
{% endblock %}

{% block content %}
<div class="standalone-container">
    <div class="mb-4">
        <a href="/intelligences" class="text-decoration-none"><i class="bi bi-arrow-left"></i> 返回情报列表</a>
    </div>

    <div id="standalone-article-body">
        <div class="text-center text-muted py-5" role="status"><i
                class="bi bi-arrow-repeat article-spinner fs-3"></i><br>正在加载…
        </div>
    </div>
</div>

<div class="container pb-4">
    <footer>
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <div><i class="bi bi-cpu"></i> Intelligence Integration System</div>
                <div class="mt-1 text-muted">© <span class="footer-year">2025</span> All rights reserved</div>
            </div>
            <div class="text-end">
                <div class="fw-bold">SleepySoft</div>
                <div class="text-muted">Turning data into insight</div>
            </div>
        </div>
    </footer>
</div>

<div id="standalone-toast-container" class="article-toast-container"></div>
{% endblock %}

{% block scripts %}
<script src="/static/js/article_detail_renderer.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 页脚年份动态更新（P2 批次 C2：去除硬编码 2025）
        document.querySelectorAll('.footer-year').forEach(el => {
            el.textContent = String(new Date().getFullYear());
        });

        // 注意：下行 Jinja 表达式必须保持单行，勿被格式化工具断开
        const uuid = {{ uuid | tojson
    }};
    const container = document.getElementById('standalone-article-body');

    try {
        const resp = await fetch(`/api/intelligence/${encodeURIComponent(uuid)}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const payload = await resp.json();
        const article = payload?.data || payload;

        // 1. 渲染 HTML
        container.innerHTML = ArticleDetailRenderer.generateHTML(article);
        document.title = article?.EVENT_TITLE || 'Intelligence Detail';

        // 2. 绑定评分事件；游客端不渲染评分提交控件
        ArticleDetailRenderer.bindEvents(container, uuid, 'standalone-toast-container');

    } catch (err) {
        // textContent 防止错误消息注入 HTML
        const alert = document.createElement('div');
        alert.className = 'alert alert-danger';
        alert.textContent = `Failed to load: ${err.message}`;
        container.replaceChildren(alert);
    }
    });
</script>
{% endblock %}
