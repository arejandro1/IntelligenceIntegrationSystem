{% extends "base.html" %}

{% block title %}情报列表 - IIS 情报中心{% endblock %}

{% block nav_list %}active{% endblock %}

{% block content %}
<div class="article-list">
    <div class="controls-container">
        <label>
            Threshold:
            <select id="threshold-select">
                <option value="0">All (0+)</option>
                <option value="4">Wait (> 4)</option>
                <option value="6" selected>Good (> 6)</option>
                <option value="8">High (> 8)</option>
            </select>
        </label>

        <label>
            Count:
            <select id="count-select">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </label>

        <button id="refresh-btn" class="refresh-btn" type="button" title="Refresh" aria-label="刷新情报列表">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>

    <h1>Intelligences</h1>

    <div id="pagination-top" class="pagination-container"></div>

    <div id="article-list-container" aria-live="polite">
    </div>

    <div id="pagination-bottom" class="pagination-container"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/article_detail_renderer.js"></script>
<script src="/static/js/intelligence_table_renderer.js"></script>
<script src="/static/js/article_modal_manager.js"></script>
<script src="/static/js/intelligence_list.js"></script>
{% endblock %}
